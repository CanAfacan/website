<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Feedback loop in the drone model</title>
  <desc id="desc">The controller supplies a control input to the drone dynamics. Position and velocity feed back into the controller for its next update.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f1f5fc"/>
      <stop offset="1" stop-color="#e4f4ee"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" stroke="#72a1ab" stroke-width="1" fill="none" opacity=".17"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0 0L5 2.5 0 5Z" fill="#2353a0"/>
    </marker>
    <marker id="arrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0 0L5 2.5 0 5Z" fill="#126858"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <rect width="960" height="400" fill="url(#grid)"/>
  <g stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M367 171H591" stroke="#2353a0" marker-end="url(#arrow-blue)"/>
    <path d="M740 251V304Q740 312 732 312H227Q219 312 219 304V259" stroke="#126858" marker-end="url(#arrow-teal)"/>
  </g>
  <g stroke-width="2.5">
    <rect x="74" y="85" width="290" height="166" rx="19" fill="#f9fcff" stroke="#4775ad"/>
    <rect x="596" y="85" width="290" height="166" rx="19" fill="#f7fdfa" stroke="#378778"/>
  </g>
  <g stroke="#2353a0" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 147H194L205 126L221 162L233 135L242 147H263"/>
  </g>
  <g transform="translate(741 145)" stroke="#126858" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-28 -18L28 18 M-28 18L28 -18" fill="none" stroke-width="5"/>
    <g fill="#f7fdfa" stroke-width="3.5">
      <ellipse cx="-29" cy="-18" rx="15" ry="8"/>
      <ellipse cx="29" cy="-18" rx="15" ry="8"/>
      <ellipse cx="-29" cy="18" rx="15" ry="8"/>
      <ellipse cx="29" cy="18" rx="15" ry="8"/>
      <rect x="-9" y="-14" width="18" height="28" rx="6"/>
    </g>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <g font-size="33" font-weight="650" fill="#142e43">
      <text x="219" y="212">Controller</text>
      <text x="741" y="212">Drone dynamics</text>
    </g>
    <g font-size="26" font-weight="550">
      <text x="478" y="145" fill="#2353a0">Control input</text>
      <text x="480" y="350" fill="#126858">Position and velocity feedback</text>
    </g>
  </g>
</svg>
